name: Standard pruefen
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: standard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Git und YAML pruefen
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          ruby -e "require 'yaml'; Dir['.github/workflows/*.{yaml,yml}'].each { |f| YAML.load_file(f); puts %(OK #{f}) }"
      - name: BINSO-CI-Profil prüfen
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          profile = json.loads(Path(".binso/ci-profile.json").read_text(encoding="utf-8"))
          assert profile["version"] == 1
          assert profile["profile"] in {"static", "backend", "critical", "tooling"}
          workflow = Path(profile["verificationWorkflow"])
          assert workflow.parent == Path(".github/workflows") and workflow.is_file()
          print("BINSO-CI-Profil:", profile["profile"])
          PY
